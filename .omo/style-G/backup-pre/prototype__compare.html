<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>OurTrail · 六风格对照表 (Contact Sheet)</title>
  <style>
    /* 对照表是实验室评审工具，不进入迁移范围 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1B1F19; color: #EDEBE0;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      padding: 28px 32px 60px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #8B917F; margin-bottom: 24px; line-height: 1.6; }
    .sheet { display: grid; gap: 26px 22px; }
    .cell { display: flex; flex-direction: column; gap: 8px; }
    .cell__label { font-size: 12px; font-weight: 600; color: #C7C5B9; display: flex; gap: 8px; align-items: baseline; }
    .cell__label em { font-style: normal; font-size: 10px; color: #757C6C; }
    .frame {
      position: relative;
      background: #101210;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .frame iframe { border: 0; display: block; transform-origin: top left; }
  </style>
</head>
<body>
  <h1>OurTrail 视觉方向对照表</h1>
  <div class="sub" id="sub">same data · same operations · 390 × 844 · scale 0.62 — 演示数据，仅布局与视觉对照</div>
  <div class="sheet" id="sheet"></div>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const styles = (q.get('styles') || 'A,B,C,D,E,F').split(',');
    const pages = (q.get('pages') || 'discover,detail,collab,weather').split(',');
    const vp = Number(q.get('vp') || 390);
    const scale = Number(q.get('scale') || 0.62);
    const h = vp === 375 ? 667 : vp === 414 ? 896 : 844;
    const STYLE_NAMES = { A: '山野编辑部', B: '瑞士功能主义', C: '静野', D: '野外仪表', E: '远征现代', F: '山野工坊' };
    const PAGE_NAMES = { discover: '发现', detail: '详情', collab: '协作', weather: '天气' };

    const sheet = document.getElementById('sheet');
    sheet.style.gridTemplateColumns = `repeat(${styles.length}, ${Math.round(vp * scale)}px)`;
    document.getElementById('sub').textContent =
      `${styles.length} 风格 × ${pages.length} 页面 · ${vp} × ${h} · scale ${scale} — same data · same operations · 演示数据`;

    for (const page of pages) {
      for (const style of styles) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const label = document.createElement('div');
        label.className = 'cell__label';
        label.innerHTML = `${style} · ${STYLE_NAMES[style] || style} <em>${PAGE_NAMES[page] || page}</em>`;
        const frame = document.createElement('div');
        frame.className = 'frame';
        frame.style.width = Math.round(vp * scale) + 'px';
        frame.style.height = Math.round((h + 0) * scale) + 'px';
        const iframe = document.createElement('iframe');
        iframe.src = `index.html?style=${style}&page=${page}&vp=${vp}&bare=1`;
        iframe.width = vp;
        iframe.height = h;
        iframe.style.transform = `scale(${scale})`;
        frame.appendChild(iframe);
        cell.append(label, frame);
        sheet.appendChild(cell);
      }
    }
  </script>
</body>
</html>
